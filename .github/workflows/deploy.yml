# GitHub Pages 자동 배포 — main 브랜치에 푸시하면 실행돼요.
# 저장소 Settings → Pages → Source 를 "GitHub Actions" 로 설정하세요.
# 저장소 Settings → Secrets and variables → Actions → Variables 에
#   (기본값: https://makeking707.github.io/coin-guide-blog 로 배포돼요)
#   도메인을 연결하면 SITE_URL (예: https://coinguide.example.com) 과 BASE_PATH=/ 를 등록하세요.

name: Deploy

on:
  push:
    branches: [main]
  # 예약 글 공개용 자동 빌드 — 깃허브가 예약 실행을 가끔 건너뛰어서 하루 3번 돌려요.
  # (UTC 기준 → 한국 시간 오전 9시 17분, 오후 1시 47분, 오후 6시 37분. 정각은 깃허브가 붐벼서 피했어요.)
  schedule:
    - cron: '17 0 * * *'
    - cron: '47 4 * * *'
    - cron: '37 9 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://makeking707.github.io' }}
          BASE_PATH: ${{ vars.BASE_PATH || '/coin-guide-blog' }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
